<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>TeachBoard Screen Ink</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", sans-serif; }
    body { position: relative; }
    body.tint { background: rgba(0, 0, 0, 0.01); } /* keeps the whole window clickable for drawing */
    body.whiteboard { background: #fff; }
    body.blackboard { background: #1b1e24; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #bar {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 2px;
      padding: 5px; background: rgba(30, 31, 36, 0.95); border: 1px solid #3a3d47; border-radius: 14px; color: #e8e9ee;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); user-select: none;
    }
    #grip { width: 14px; height: 30px; cursor: move; display: grid; place-items: center; color: #777; font-size: 14px; letter-spacing: -2px; }
    .b { width: 36px; height: 36px; border: none; border-radius: 9px; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; }
    .b:hover { background: #30333c; }
    .b.on { background: #3b82f6; color: #fff; }
    .b.close:hover { background: #ef4444; }
    .sep { width: 1px; height: 24px; background: #3a3d47; margin: 0 4px; }
    .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); cursor: pointer; margin: 0 2px; padding: 0; }
    .sw.on { outline: 2px solid #fff; outline-offset: 2px; }
    .tb-text-editor { position: absolute; z-index: 4; border: 1.5px dashed #3b82f6; outline: none; resize: none; overflow: hidden; white-space: pre; margin: 0; }
    .tb-label-editor { text-align: center; background: rgba(255,255,255,.6); white-space: pre-wrap; }
    #mouseHint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(17,17,17,.9); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 10; }
  </style>
</head>
<body class="tint">
  <canvas id="ink"></canvas>
  <div id="bar"></div>
  <div id="mouseHint" hidden>Mouse mode — you can click programs underneath. Press the pen to draw again.</div>
  <script src="engine.js"></script>
  <script src="icons.js"></script>
  <script src="ink.js"></script>
</body>
</html>
