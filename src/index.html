<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' data: blob:" />
  <title>TeachBoard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand" title="TeachBoard — developed by Sahan Silva">
        <img src="assets/app-icon-64.png" width="26" height="26" alt="TeachBoard" />
      </div>
      <div id="tabs"></div>
      <button id="newTabBtn" class="icon-btn" title="New tab (Ctrl+T)"></button>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </header>
    <div id="main">
      <aside id="toolrail"></aside>
      <div id="stage">
        <div id="divider" hidden></div>
      </div>
    </div>
  </div>
  <div id="popover" hidden></div>
  <div id="toasts"></div>

  <script src="../node_modules/pdfjs-dist/build/pdf.min.js"></script>
  <script src="../node_modules/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="engine.js"></script>
  <script src="icons.js"></script>
  <script src="tabs.js"></script>
  <script src="widgets.js"></script>
  <script src="app.js"></script>
</body>
</html>
